<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streuph's Maze — V2 definition gallery</title>
  <link rel="stylesheet" href="src/css/sm.css">
  <style>
    body { height: auto; overflow: auto; padding: 1rem; }
    .gallery-header { display: block; padding: 1rem; margin-bottom: 1rem; }
    .gallery-controls { display: flex; flex-wrap: wrap; gap: 1rem; }
    .gallery-controls label { display: flex; gap: .5rem; align-items: center; }
    #gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1rem; padding: 0; align-items: stretch; }
    .glyph-card { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: .75rem; border: 1px solid var(--line); padding: .75rem; background: var(--panel); }
    .preview { width: 64px; height: 64px; background: var(--panel-2); border: 1px solid var(--mute); }
    .preview svg { width: 100%; height: 100%; display: block; }
    .preview[data-outcome="failed"] { outline: 2px solid var(--red); }
    .glyph-card h2 { margin: 0; font-size: 1rem; overflow-wrap: anywhere; }
    .glyph-card p { font-size: .8rem; margin: .4rem 0; }
    .glyph-card pre { max-height: 18rem; overflow: auto; white-space: pre-wrap; font-size: .72rem; }
    .glyph-card select { width: 100%; }
    a { color: var(--wht); }
  </style>
</head>
<body>
  <header class="gallery-header">
    <h1>V2 tile and object gallery</h1>
    <p>Actual registered definitions, including tile 0 and the separate dot object.
      Samples below are presentation data, not a second gameplay simulator.</p>
    <p><a href="index.html">Play</a> · <a href="docs/level-design/tile-mechanics.md">Full definitions and pack usage</a></p>
    <div class="gallery-controls">
      <label>Dot color <select id="sample-P"></select></label>
      <label>World / goal color <select id="sample-W"></select></label>
      <label>Conveyor tint (reserved) <select id="sample-tint"></select></label>
    </div>
    <p id="status" role="status">Loading local registry…</p>
  </header>
  <main id="gallery" role="list" aria-label="Registered tile and object definitions"></main>
  <script src="src/js/tiles.js"></script>
  <script src="src/js/sm-glyphs.js"></script>
  <script>
  (function () {
    'use strict';
    var status = document.getElementById('status');
    try {
      var SM = window.SM;
      var registry = SM.getActiveRegistry();
      var tiles = Object.keys(registry).map(Number).sort(function (a, b) { return a - b; })
        .map(function (id) { return registry[id]; }).filter(function (tile) { return tile.implemented !== false; });
      var definitions = [SM.DOT_DEFINITION].concat(tiles);
      var controls = ['sample-P', 'sample-W', 'sample-tint'].map(function (id) {
        var select = document.getElementById(id);
        SM.GAME_COLOURS.forEach(function (color) {
          var option = document.createElement('option'); option.value = color; option.textContent = SM.COLOUR_NAMES[color]; select.appendChild(option);
        });
        return select;
      });
      function direction(params) {
        if (!params.dir) return 'not directional';
        return params.dir.x > 0 ? 'east' : params.dir.x < 0 ? 'west' : params.dir.y > 0 ? 'north' : 'south';
      }
      function viewFor(mode) {
        return { P: controls[0].value, W: controls[1].value, polarity: 'red-open',
          solid: mode === 'closed', locked: mode === 'closed' || mode === 'pending',
          requestedSolid: mode === 'closed' || mode === 'pending', pendingClose: mode === 'pending',
          active: mode === 'active', latched: mode === 'active', failed: mode === 'failed',
          lit: mode === 'active' ? { n: true, e: true, s: true, w: true } : {} };
      }
      var redraws = [];
      definitions.forEach(function (definition) {
        var card = document.createElement('article'); card.className = 'glyph-card'; card.setAttribute('role', 'listitem');
        if (definition.id === undefined) card.dataset.objectId = 'dot'; else card.dataset.tileId = definition.id;
        var preview = document.createElement('div'); preview.className = 'preview'; preview.setAttribute('role', 'img');
        var content = document.createElement('div'), title = document.createElement('h2');
        title.textContent = definition.name + (definition.id === undefined ? ' — object, no tile ID' : ' — ID ' + definition.id);
        var classification = document.createElement('p'); classification.textContent = definition.category + ' / ' + definition.family + ' · ' + definition.layer;
        var select = document.createElement('select'); select.setAttribute('aria-label', 'Display sample for ' + definition.name + ' ' + (definition.id === undefined ? 'object' : definition.id));
        var modes = definition.closingSurface ? ['open', 'closed', 'pending'] : definition.entityRole === 'dot' ? ['playing', 'failed'] :
          definition.strategies && definition.strategies.activation ? ['inactive', 'active'] : ['default'];
        modes.forEach(function (mode) { var option = document.createElement('option'); option.value = mode; option.textContent = 'Display: ' + mode; select.appendChild(option); });
        var description = document.createElement('p'), details = document.createElement('details'), summary = document.createElement('summary');
        summary.textContent = 'Definition defaults, hooks, and state metadata';
        var attributes = document.createElement('pre');
        attributes.textContent = JSON.stringify({ category: definition.category, layer: definition.layer,
          defaults: definition.id === undefined ? { colour: definition.defaultColour } : definition.params, capabilities: definition.capabilities || {},
          selfMovable: definition.selfMovable, vulnerableToRays: definition.vulnerableToRays,
          colourRole: definition.colourRole, closingSurface: definition.closingSurface || false,
          strategies: definition.strategies || {}, state: definition.state || {} }, null, 2);
        details.appendChild(summary); details.appendChild(attributes);
        content.appendChild(title); content.appendChild(classification); content.appendChild(select); content.appendChild(description); content.appendChild(details);
        card.appendChild(preview); card.appendChild(content); document.getElementById('gallery').appendChild(card);
        function redraw() {
          var sample = definition.colourRole === 'reserved-tint' ? Object.assign({}, definition,
            { params: Object.assign({}, definition.params, { colour: controls[2].value }) }) : definition;
          var view = viewFor(select.value), params = sample.params || {}, caps = sample.capabilities || {};
          preview.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + SM.glyph(sample, view) + '</svg>';
          preview.dataset.outcome = view.failed ? 'failed' : 'playing';
          preview.setAttribute('aria-label', title.textContent + '; ' + select.value + '; ' + direction(params));
          var values = { direction: direction(params), colour: SM.COLOUR_NAMES[params.colour || 'wht'],
            link: params.link === undefined ? 0 : params.link, mode: params.mode || 'none', scope: params.scope || 'none',
            carrierLabel: params.carrier === 'W' ? 'world' : 'dot', activeLabel: view.active ? 'active' : 'inactive',
            lockLabel: view.pendingClose ? 'pending close' : view.solid ? 'closed' : 'open',
            solidLabel: view.solid ? 'closed' : 'open', polarityLabel: view.polarity,
            mobilityLabel: (caps.pushable ? 'pushable' : 'fixed') + (caps.pullable ? ', pullable' : ''),
            rayCount: 'presentation sample', playerColour: SM.COLOUR_NAMES[view.P], worldColour: SM.COLOUR_NAMES[view.W] };
          description.textContent = ((sample.presentation && sample.presentation.codex) || 'No intrinsic effect.').replace(/\{([A-Za-z0-9_]+)\}/g,
            function (token, key) { return values[key] === undefined ? token : values[key]; });
          if (sample.colourRole === 'reserved-tint') description.textContent += ' Display tint: ' + SM.COLOUR_NAMES[controls[2].value] + ' (inert).';
        }
        select.addEventListener('change', redraw); redraws.push(redraw); redraw();
      });
      controls.forEach(function (select) { select.addEventListener('change', function () { redraws.forEach(function (redraw) { redraw(); }); }); });
      status.textContent = definitions.length + ' definitions — ' + tiles.length + ' registered tiles + dot. No numeric-gap placeholders.';
      document.documentElement.dataset.galleryReady = 'true';
    } catch (error) { status.textContent = 'Gallery error: ' + error.message; console.error(error); }
  })();
  </script>
</body>
</html>
