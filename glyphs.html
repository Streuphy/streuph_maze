<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Galerie Vivante & Introspection des Glyphs</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1e29;
            --border-color: #2f364d;
            --accent-color: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #c7d2fe;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            margin: 30px 0 15px 0;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .preview-box {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 4px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .glyph-visual {
            width: 42px;
            height: 42px;
            background: #000;
            border: 1px solid #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .props-container {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: #111827;
            padding: 6px;
            border-radius: 4px;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid #1f2937;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🧭 STREUPH MAZE — GALERIE DES GLYPHS & MOTEUR</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Introspection dynamique des modules sources (`src/js/`)</p>
        </header>

        <main id="app-viewport">
            <p style="text-align: center; color: var(--text-muted);">Chargement et analyse dynamique des modules en cours...</p>
        </main>
    </div>

    <script type="module">
        const viewport = document.getElementById('app-viewport');

        async function loadLiveModules() {
            let modulesData = {};

            try {
                // Importation dynamique des modules source réels du projet
                const tilesModule = await import('./src/js/tiles.js').catch(() => null);
                const glyphsModule = await import('./src/js/sm-glyphs.js').catch(() => null);

                if (tilesModule) {
                    modulesData["Tiles Module (tiles.js)"] = tilesModule.Tiles || tilesModule.default || tilesModule;
                }
                if (glyphsModule) {
                    modulesData["Glyphs Module (sm-glyphs.js)"] = glyphsModule.Glyphs || glyphsModule.default || glyphsModule;
                }
            } catch (err) {
                console.warn("Erreur lors du chargement des modules ES :", err);
            }

            viewport.innerHTML = '';
            let totalEntries = 0;

            for (const [modName, dataObj] of Object.entries(modulesData)) {
                // Filtrer pour ne garder que les objets/dictionnaires exploitables
                if (!dataObj || typeof dataObj !== 'object') continue;
                
                const entries = Object.entries(dataObj).filter(([k, v]) => v && typeof v === 'object' && !Array.isArray(v));
                if (entries.length === 0) continue;

                const section = document.createElement('section');
                const title = document.createElement('div');
                title.className = 'section-title';
                title.textContent = `${modName} (${entries.length} entité${entries.length > 1 ? 's' : ''})`;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'grid';

                entries.forEach(([key, val]) => {
                    totalEntries++;
                    const card = document.createElement('div');
                    card.className = 'card';

                    const name = val.name || val.label || key;
                    const jsonProps = JSON.stringify(val, (k, v) => typeof v === 'function' ? '[Function]' : v, 2);

                    // Génération du rendu graphique heuristique (SVG, Caractère ou ID abrégé)
                    let visualHtml = `<span style="font-size:0.8rem; color:#34d399; font-weight:bold;">${key.substring(0,3)}</span>`;
                    if (val.svg && typeof val.svg === 'string') {
                        visualHtml = val.svg;
                    } else if (val.char || val.symbol) {
                        visualHtml = `<span style="font-size:1.4rem; color:#fff;">${val.char || val.symbol}</span>`;
                    }

                    card.innerHTML = `
                        <div class="card-header">
                            <span style="font-weight:bold; color:#fff;">${name}</span>
                            <span style="font-size:0.7rem; background:#111827; padding:2px 5px; border-radius:3px; color:#9ca3af;">${key}</span>
                        </div>
                        <div class="preview-box">
                            <div class="glyph-visual">${visualHtml}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted); flex-grow:1;">
                                ${val.description || val.desc || 'Propriétés vectorielles et logiques du moteur'}
                            </div>
                        </div>
                        <div class="props-container"><pre>${jsonProps}</pre></div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                viewport.appendChild(section);
            }

            if (totalEntries === 0) {
                viewport.innerHTML = `
                    <div style="text-align: center; color: #ef4444; padding: 20px;">
                        <p>⚠️ Aucun dictionnaire exporté n'a pu être lu automatiquement depuis les modules.</p>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Vérifiez que <code>tiles.js</code> et <code>sm-glyphs.js</code> exportent bien leurs structures (ex: <code>export const Tiles = ...</code>).</p>
                    </div>`;
            }
        }

        loadLiveModules();
    </script>
</body>
</html>
