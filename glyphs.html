<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Rendu Moteur (IDs 1-100)</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1e29;
            --border-color: #2f364d;
            --accent-color: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .tile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tile-card.unimplemented {
            opacity: 0.4;
            background: #111318;
            border-style: dashed;
        }

        .engine-tile-view {
            width: 48px;
            height: 48px;
            background: #000;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
        }

        .tile-info {
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .tile-id {
            font-size: 0.75rem;
            background: #111827;
            padding: 1px 5px;
            border-radius: 3px;
            color: var(--text-muted);
            width: fit-content;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🧭 STREUPH MAZE — MOTEUR DE RENDU (IDS 1 - 100)</h1>
            <p style="color: var(--text-muted); font-size: 0.8rem;">Inspection séquentielle avec gestion des exceptions par ID</p>
        </header>

        <main id="viewport">
            <p style="text-align: center; color: var(--text-muted);">Initialisation du pipeline de rendu...</p>
        </main>
    </div>

    <script type="module">
        import * as TilesMod from './src/js/tiles.js';
        import * as GlyphsMod from './src/js/sm-glyphs.js';

        const viewport = document.getElementById('viewport');

        async function renderEnginePipeline() {
            viewport.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'grid';

            // Résolution des exports potentiels
            const tilesSource = TilesMod.Tiles || TilesMod.default || TilesMod;
            const glyphsSource = GlyphsMod.Glyphs || GlyphsMod.default || GlyphsMod;

            // Fonction utilitaire pour récupérer une tuile par ID de manière sécurisée
            function resolveTileData(id) {
                try {
                    // Stratégie 1 : Recherche directe si c'est un tableau ou un objet indexé
                    if (tilesSource[id]) return tilesSource[id];
                    if (glyphsSource[id]) return glyphsSource[id];

                    // Stratégie 2 : Recherche par fonction getter si elle existe
                    if (typeof tilesSource.get === 'function') {
                        const res = tilesSource.get(id);
                        if (res) return res;
                    }
                    if (typeof glyphsSource.get === 'function') {
                        const res = glyphsSource.get(id);
                        if (res) return res;
                    }

                    // Stratégie 3 : Recherche par propriété .id dans les objets exportés
                    const allEntries = [...Object.values(tilesSource), ...Object.values(glyphsSource)];
                    const found = allEntries.find(item => item && (item.id === id || item.index === id));
                    if (found) return found;

                    throw new Error(`ID ${id} non implémenté dans les modules`);
                } catch (e) {
                    throw e; // Propager pour capture
                }
            }

            // Boucle explicite de 1 à 100 comme demandé
            for (let id = 1; id <= 100; id++) {
                const card = document.createElement('div');
                let tileData = null;
                let isImplemented = true;

                try {
                    tileData = resolveTileData(id);
                } catch (err) {
                    isImplemented = false;
                }

                if (isImplemented && tileData) {
                    card.className = 'tile-card';
                    
                    let visualHTML = `<span style="font-size:0.9rem; color:#34d399;">#${id}</span>`;
                    if (tileData.svg && typeof tileData.svg === 'string') {
                        visualHTML = tileData.svg;
                    } else if (tileData.char || tileData.symbol) {
                        visualHTML = `<span style="font-size:1.4rem; color:#fff;">${tileData.char || tileData.symbol}</span>`;
                    }

                    const name = tileData.name || tileData.label || `Tile_${id}`;
                    const desc = tileData.description || tileData.desc || 'Propriété active du moteur';

                    card.innerHTML = `
                        <div class="engine-tile-view">${visualHTML}</div>
                        <div class="tile-info">
                            <span class="tile-id">ID: ${id}</span>
                            <span style="font-weight:bold; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${name}</span>
                            <span style="color:var(--text-muted); font-size:0.7rem;">${desc}</span>
                        </div>
                    `;
                } else {
                    // ID non implémenté ou capturé par exception
                    card.className = 'tile-card unimplemented';
                    card.innerHTML = `
                        <div class="engine-tile-view"><span style="font-size:0.7rem; color:#6b7280;">N/A</span></div>
                        <div class="tile-info">
                            <span class="tile-id">ID: ${id}</span>
                            <span style="color:#6b7280; font-style:italic;">Non implémenté</span>
                        </div>
                    `;
                }

                grid.appendChild(card);
            }

            viewport.appendChild(grid);
        }

        renderEnginePipeline();
    </script>
</body>
</html>
