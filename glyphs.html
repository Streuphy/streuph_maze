<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Galerie Exhaustive des Glyphs</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --accent-color: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }

        .glyph-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        /* Conteneur 1x1 Field aligné sur le rendu principal */
        .field-1x1 {
            width: 48px;
            height: 48px;
            background: #000;
            border: 2px solid #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .glyph-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.8rem;
            overflow: hidden;
        }

        .glyph-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .glyph-name { font-weight: bold; color: #fff; font-size: 0.9rem; }
        .glyph-badge { background: #1e293b; color: #38bdf8; padding: 1px 5px; border-radius: 3px; font-size: 0.7rem; }
        .glyph-category { color: #a78bfa; font-size: 0.7rem; text-transform: uppercase; }

        .attributes-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 4px;
            padding: 5px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .attr-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.05); padding: 1px 0; }
        .attr-k { color: #94a3b8; }
        .attr-v { color: #f1f5f9; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h2>🧭 STREUPH MAZE — GALERIE EXHAUSTIVE DES GLYPHS</h2>
            <p style="color: var(--text-muted); font-size: 0.8rem;">Introspection dynamique des registres du moteur global</p>
        </header>

        <div id="status" style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">Analyse et chargement des registres...</div>
        <main id="gallery-viewport" class="gallery-grid"></main>
    </div>

    <!-- Chargement des scripts classiques du moteur -->
    <script src="src/js/tiles.js"></script>
    <script src="src/js/sm-glyphs.js"></script>
    <script src="src/js/sm-entities.js"></script>
    <script src="src/js/sm-render.js"></script>
    <script src="src/js/sm-board.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const viewport = document.getElementById('gallery-viewport');
            const statusEl = document.getElementById('status');
            
            let items = [];

            // Fonction de récolte robuste parcourant les sources du scope global
            function harvestRegistry(sourceObj, categoryName) {
                if (!sourceObj || typeof sourceObj !== 'object') return;
                Object.entries(sourceObj).forEach(([key, val]) => {
                    if (val && typeof val === 'object' && !Array.isArray(val)) {
                        if (val.name || val.label || val.svg || val.char || val.symbol || val.id !== undefined) {
                            items.push({
                                key: key,
                                name: val.name || val.label || key,
                                category: val.category || categoryName || 'Général',
                                id: val.id !== undefined ? val.id : items.length + 1,
                                svg: val.svg || null,
                                char: val.char || val.symbol || null,
                                raw: val
                            });
                        }
                    } else if (Array.isArray(val)) {
                        val.forEach((subVal, idx) => {
                            if (subVal && typeof subVal === 'object') {
                                items.push({
                                    key: `${key}_${idx}`,
                                    name: subVal.name || subVal.label || `${key}_${idx}`,
                                    category: subVal.category || categoryName || 'Collection',
                                    id: subVal.id !== undefined ? subVal.id : items.length + 1,
                                    svg: subVal.svg || null,
                                    char: subVal.char || subVal.symbol || null,
                                    raw: subVal
                                });
                            }
                        });
                    }
                });
            }

            // Inspection des namespaces globaux potentiels du moteur
            const potentialGlobals = ['SM', 'Tiles', 'Glyphs', 'Entities', 'TILE_TYPES', 'GLYPH_TYPES', 'Board', 'Render'];
            potentialGlobals.forEach(gName => {
                if (window[gName]) {
                    harvestRegistry(window[gName], gName);
                }
            });

            // Fallback : balayage des objets personnalisés sur window
            Object.keys(window).forEach(wKey => {
                if (!potentialGlobals.includes(wKey) && !wKey.startsWith('webkit') && !wKey.startsWith('on')) {
                    const obj = window[wKey];
                    if (obj && typeof obj === 'object' && obj !== window) {
                        const subEntries = Object.values(obj);
                        if (subEntries.some(e => e && typeof e === 'object' && (e.svg || e.char || e.name))) {
                            harvestRegistry(obj, wKey);
                        }
                    }
                }
            });

            // Dédoublonnement par ID ou nom
            const uniqueMap = new Map();
            items.forEach(item => {
                const identifier = item.id !== undefined ? item.id : item.name;
                if (!uniqueMap.has(identifier)) {
                    uniqueMap.set(identifier, item);
                }
            });

            const finalGlyphs = Array.from(uniqueMap.values());
            statusEl.textContent = `Galerie exhaustive : ${finalGlyphs.length} glyphe(s) et tuile(s) implémenté(s) détecté(s).`;
            viewport.innerHTML = '';

            if (finalGlyphs.length === 0) {
                viewport.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444;">Aucun glyphe détecté dans le scope global. Vérifiez les structures source.</div>`;
                return;
            }

            finalGlyphs.forEach(g => {
                const card = document.createElement('div');
                card.className = 'glyph-card';

                const fieldBox = document.createElement('div');
                fieldBox.className = 'field-1x1';

                if (g.svg && typeof g.svg === 'string') {
                    fieldBox.innerHTML = g.svg;
                } else if (g.char) {
                    fieldBox.innerHTML = `<span style="font-size:1.6rem; color:#fff;">${g.char}</span>`;
                } else {
                    fieldBox.innerHTML = `<span style="font-size:0.75rem; color:#38bdf8;">#${g.id}</span>`;
                }

                const skipKeys = ['svg', 'render', 'draw', 'callback', 'handler', 'raw'];
                const attrHtml = Object.entries(g.raw)
                    .filter(([k, v]) => !skipKeys.includes(k) && v !== null && typeof v !== 'function')
                    .map(([k, v]) => `
                        <div class="attr-row">
                            <span class="attr-k">${k}:</span>
                            <span class="attr-v">${typeof v === 'object' ? JSON.stringify(v) : v}</span>
                        </div>
                    `).join('');

                card.innerHTML = `
                    <div class="field-slot"></div>
                    <div class="glyph-info">
                        <div class="glyph-header-row">
                            <span class="glyph-name">${g.name}</span>
                            <span class="glyph-badge">ID: ${g.id}</span>
                        </div>
                        <div class="glyph-category">Catégorie : ${g.category}</div>
                        <div class="attributes-box">
                            ${attrHtml || '<div style="color:var(--text-muted); font-style:italic;">Aucun attribut additionnel</div>'}
                        </div>
                    </div>
                `;
                card.querySelector('.field-slot').replaceWith(fieldBox);
                viewport.appendChild(card);
            });
        });
    </script>
</body>
</html>
