<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Galerie Exhaustive des Glyphs</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1e29;
            --border-color: #2f364d;
            --accent-color: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .category-section { margin-bottom: 40px; }
        .category-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #c7d2fe;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .glyph-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .glyph-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .glyph-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .glyph-name { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .glyph-id { font-size: 0.8rem; background: #111827; padding: 2px 6px; border-radius: 4px; color: var(--text-muted); }

        .glyph-preview-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #111827;
            padding: 10px;
            border-radius: 4px;
        }

        .glyph-svg-visual {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            background: #000;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glyph-description { font-size: 0.85rem; color: var(--text-muted); line-height: 1.3; }

        .glyph-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #12151c;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151; transition: .3s; border-radius: 18px;
        }
        .slider:before {
            position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(16px); }

        select {
            background: #1f2937; color: #fff; border: 1px solid #4b5563; border-radius: 4px; padding: 2px 6px; font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🧭 STREUPH MAZE — CATALOGUE EXHAUSTIF DES GLYPHS</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Rendu vectoriel et inspection dynamique des tuiles du moteur</p>
        </header>

        <main id="glyph-viewport"></main>
    </div>

    <script type="module">
        let Tiles = {};
        try {
            const module = await import('src/js/tiles.js');
            Tiles = module.Tiles || module;
        } catch (e) {
            console.warn("Module tiles.js non chargé directement, utilisation du catalogue étendu.");
        }

        const viewport = document.getElementById('glyph-viewport');
        
        // Catalogue complet couvrant l'ensemble des catégories et types de tuiles du jeu
        const categories = {
            "Structures & Obstacles": [
                {
                    id: "TILE_WALL",
                    name: "Mur Standard",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32" fill="#4f46e5"><rect x="2" y="2" width="20" height="20" rx="2" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/><path d="M2 12h20M12 2v20" stroke="#818cf8" stroke-width="1"/></svg>`,
                    desc: "Obstacle géométrique infranchissable de base.",
                    stateToggle: true,
                    stateLabel: "Collision"
                },
                {
                    id: "TILE_CRUMBLING",
                    name: "Mur Instable",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><rect x="2" y="2" width="20" height="20" rx="2" fill="#292524" stroke="#d97706" stroke-width="2" stroke-dasharray="3,3"/><path d="M6 6l12 12M18 6L6 18" stroke="#d97706" stroke-width="1"/></svg>`,
                    desc: "S'effrite ou se transmute sous l'impact.",
                    stateToggle: false,
                    stateLabel: "Fragile"
                },
                {
                    id: "TILE_OBSTACLE",
                    name: "Obstacle Fixe",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><rect x="4" y="4" width="16" height="16" fill="#312e81" stroke="#6366f1" stroke-width="2"/></svg>`,
                    desc: "Bloc lourd bloquant le passage des entités.",
                    stateToggle: true,
                    stateLabel: "Actif"
                }
            ],
            "Circulation & Sols": [
                {
                    id: "TILE_FLOOR",
                    name: "Sol / Couloir",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><rect x="2" y="2" width="20" height="20" fill="#111827" stroke="#374151" stroke-width="1"/><circle cx="12" cy="12" r="2" fill="#6b7280"/></svg>`,
                    desc: "Zone de déplacement libre standard.",
                    stateToggle: false,
                    stateLabel: "Traversal",
                    selectOptions: ["Libre", Restreint]
                },
                {
                    id: "TILE_EMPTY",
                    name: "Vide / Abîme",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><rect x="2" y="2" width="20" height="20" fill="#030712" stroke="#1f2937" stroke-width="1"/></svg>`,
                    desc: "Espace inoccupé ou infranchissable par le vide.",
                    stateToggle: false,
                    stateLabel: "Abîme"
                },
                {
                    id: "TILE_PATH",
                    name: "Sentier Guidé",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><path d="M12 2v20M2 12h20" stroke="#10b981" stroke-width="2" stroke-dasharray="2,2"/></svg>`,
                    desc: "Trace ou chemin lumineux d'orientation.",
                    stateToggle: true,
                    stateLabel: "Visibilité"
                }
            ],
            "Logique & Objectifs": [
                {
                    id: "TILE_GATE",
                    name: "Porte Binaire",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><circle cx="12" cy="12" r="9" fill="#065f46" stroke="#34d399" stroke-width="2"/><path d="M12 6v12M6 12h12" stroke="#34d399" stroke-width="2"/></svg>`,
                    desc: "Bascule d'état selon la polarité du circuit.",
                    stateToggle: true,
                    stateLabel: "Ouvert / Fermé"
                },
                {
                    id: "TILE_TARGET",
                    name: "Cible / Objectif",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><circle cx="12" cy="12" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#f59e0b"/></svg>`,
                    desc: "Emplacement recevant une caisse ou un signal.",
                    stateToggle: true,
                    stateLabel: "Validé"
                },
                {
                    id: "TILE_SWITCH",
                    name: "Interrupteur de Sol",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><polygon points="12,4 20,20 4,20" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/></svg>`,
                    desc: "Déclenche une action lorsqu'activé.",
                    stateToggle: true,
                    stateLabel: "État"
                }
            ],
            "Effets & Transmutations": [
                {
                    id: "TILE_AURA",
                    name: "Aura Chromatique",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><polygon points="12,2 22,22 2,22" fill="#581c87" stroke="#c084fc" stroke-width="2"/></svg>`,
                    desc: "Champ d'influence modifiant les tuiles adjacentes.",
                    stateToggle: false,
                    stateLabel: "Spectre",
                    selectOptions: ["Rouge", "Vert", "Bleu"]
                },
                {
                    id: "TILE_PORTAL",
                    name: "Portail Quantique",
                    svg: `<svg viewBox="0 0 24 24" width="32" height="32"><ellipse cx="12" cy="12" rx="4" ry="9" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/></svg>`,
                    desc: "Téléporte les entités d'un point à un autre.",
                    stateToggle: true,
                    stateLabel: "Actif"
                }
            ]
        };

        if (viewport) {
            viewport.innerHTML = '';

            for (const [categoryName, glyphs] of Object.entries(categories)) {
                const section = document.createElement('section');
                section.className = 'category-section';

                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = categoryName;
                section.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'glyph-grid';

                glyphs.forEach(g => {
                    const card = document.createElement('div');
                    card.className = 'glyph-card';

                    let controlsHtml = '';
                    if (g.stateToggle) {
                        controlsHtml += `
                            <div class="control-row">
                                <span>${g.stateLabel}:</span>
                                <label class="switch">
                                    <input type="checkbox" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>`;
                    }
                    if (g.selectOptions) {
                        const options = g.selectOptions.map(opt => `<option value="${opt}">${opt}</option>`).join('');
                        controlsHtml += `
                            <div class="control-row">
                                <span>${g.stateLabel}:</span>
                                <select>${options}</select>
                            </div>`;
                    }

                    card.innerHTML = `
                        <div class="glyph-header">
                            <span class="glyph-name">${g.name}</span>
                            <span class="glyph-id">${g.id}</span>
                        </div>
                        <div class="glyph-preview-container">
                            <div class="glyph-svg-visual">${g.svg}</div>
                            <div class="glyph-description">${g.desc}</div>
                        </div>
                        <div class="glyph-controls">
                            ${controlsHtml || '<div class="control-row"><span>Statut:</span><span style="color: #34d399;">Actif</span></div>'}
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                viewport.appendChild(section);
            }
        }
    </script>
</body>
</html>
