<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Engine Glyph Registry (0-255)</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1e29;
            --border-color: #2f364d;
            --accent-color: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .preview-box {
            background: #111827;
            border: 1px solid #374151;
            border-radius: 4px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .glyph-visual {
            width: 48px;
            height: 48px;
            background: #000;
            border: 1px solid #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .props {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: #111827;
            padding: 4px;
            border-radius: 4px;
            max-height: 80px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>🧭 STREUPH MAZE — REGISTRE DES GLYPHS (ID 0 - 255)</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Rendu séquentiel basé sur l'état réel des modules du moteur</p>
        </header>

        <main id="viewport">
            <p style="text-align: center; color: var(--text-muted);">Chargement et analyse des registres (0-255)...</p>
        </main>
    </div>

    <script type="module">
        import * as TilesMod from './src/js/tiles.js';
        import * as GlyphsMod from './src/js/sm-glyphs.js';

        const viewport = document.getElementById('viewport');

        async function initInspector() {
            let extractedItems = [];

            // Helper to extract items safely from modules regardless of export shape
            function harvestModule(mod) {
                if (!mod) return;
                const candidateContainers = [
                    mod.Tiles, mod.Glyphs, mod.tiles, mod.glyphs, 
                    mod.default, mod
                ];
                
                candidateContainers.forEach(container => {
                    if (!container) return;
                    if (Array.isArray(container)) {
                        container.forEach((item, idx) => {
                            if (item && typeof item === 'object') {
                                extractedItems.push({
                                    id: item.id !== undefined ? item.id : idx,
                                    name: item.name || item.label || `Tile_${idx}`,
                                    desc: item.description || item.desc || 'Entité du moteur',
                                    svg: item.svg || item.renderSvg || null,
                                    char: item.char || item.symbol || null,
                                    raw: item
                                });
                            }
                        });
                    } else if (typeof container === 'object') {
                        Object.entries(container).forEach(([key, val], idx) => {
                            if (val && typeof val === 'object' && !Array.isArray(val)) {
                                extractedItems.push({
                                    id: val.id !== undefined ? val.id : idx,
                                    key: key,
                                    name: val.name || val.label || key,
                                    desc: val.description || val.desc || 'Entité du moteur',
                                    svg: val.svg || val.renderSvg || null,
                                    char: val.char || val.symbol || null,
                                    raw: val
                                });
                            }
                        });
                    }
                });
            }

            harvestModule(TilesMod);
            harvestModule(GlyphsMod);

            viewport.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'grid';

            let renderedCount = 0;

            // Parcourir séquentiellement de ID 0 à 255
            for (let id = 0; id <= 255; id++) {
                // Trouver le glyph/tuile correspondant à cet ID exact ou index
                const tile = extractedItems.find(item => item.id === id) || extractedItems[id];
                
                if (!tile) continue; // Ignorer les IDs non implémentés
                renderedCount++;

                const card = document.createElement('div');
                card.className = 'card';

                // Génération de la géométrie visuelle aux dimensions du niveau (index.html style)
                let visualContent = `<span style="font-size:0.8rem; color:#34d399;">#${tile.id}</span>`;
                if (tile.svg) {
                    visualContent = tile.svg;
                } else if (tile.char) {
                    visualContent = `<span style="font-size:1.5rem; color:#fff;">${tile.char}</span>`;
                } else {
                    visualContent = `<svg viewBox="0 0 24 24" width="32" height="32"><rect width="24" height="24" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/><text x="12" y="16" font-size="9" fill="#fff" text-anchor="middle">${tile.id}</text></svg>`;
                }

                card.innerHTML = `
                    <div class="card-header">
                        <span style="font-weight:bold; color:#fff;">${tile.name}</span>
                        <span style="font-size:0.7rem; background:#111827; padding:2px 5px; border-radius:3px; color:#9ca3af;">ID: ${tile.id}</span>
                    </div>
                    <div class="preview-box">
                        <div class="glyph-visual">${visualContent}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted); flex-grow:1;">${tile.desc}</div>
                    </div>
                    <div class="props"><pre>${JSON.stringify(tile.raw, (k,v) => typeof v === 'function' ? '[Function]' : v, 2)}</pre></div>
                `;
                grid.appendChild(card);
            }

            if (renderedCount === 0) {
                viewport.innerHTML = `
                    <div style="text-align: center; color: #ef4444; padding: 20px;">
                        <p>⚠️ Aucun enregistrement n'a pu être extrait des modules <code>tiles.js</code> / <code>sm-glyphs.js</code>.</p>
                        <p style="font-size: 0.8rem; color: var(--text-muted);">Assurez-vous que les objets exportés contiennent des propriétés identifiables.</p>
                    </div>`;
            } else {
                viewport.appendChild(grid);
            }
        }

        initInspector();
    </script>
</body>
</html>
