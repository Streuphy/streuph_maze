<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Registre Complet des Glyphs (1-256)</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1e29;
            --border-color: #2f364d;
            --accent-color: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }
        .tile-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tile-card.unimplemented {
            opacity: 0.3;
            background: #111318;
            border-style: dashed;
        }
        .engine-view {
            width: 48px;
            height: 48px;
            background: #000;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .tile-info {
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h2>🧭 STREUPH MAZE — REGISTRE DES TILES (1 - 256)</h2>
            <p style="color: var(--text-muted); font-size: 0.75rem;">Introspection par primitive d'ID native du moteur</p>
        </header>

        <main id="viewport">
            <p style="text-align: center; color: var(--text-muted);">Chargement du registre en cours...</p>
        </main>
    </div>

    <script type="module">
        import * as TilesMod from './src/js/tiles.js';
        import * as GlyphsMod from './src/js/sm-glyphs.js';

        const viewport = document.getElementById('viewport');

        async function renderRegistry() {
            viewport.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'grid';

            // Consolidation des sources du moteur
            const tilesData = TilesMod.Tiles || TilesMod.default || TilesMod;
            const glyphsData = GlyphsMod.Glyphs || GlyphsMod.default || GlyphsMod;

            // Fonction robuste pour récupérer une tuile par son ID (1 à 256)
            function getTileById(id) {
                try {
                    // 1. Accès direct si tableau ou dictionnaire indicé
                    if (tilesData && tilesData[id]) return tilesData[id];
                    if (glyphsData && glyphsData[id]) return glyphsData[id];

                    // 2. Appel de méthode getter si disponible
                    if (tilesData && typeof tilesData.get === 'function') {
                        const res = tilesData.get(id);
                        if (res) return res;
                    }

                    // 3. Recherche par correspondance de propriété .id ou .index
                    const allValues = [
                        ...(Array.isArray(tilesData) ? tilesData : Object.values(tilesData || {})),
                        ...(Array.isArray(glyphsData) ? glyphsData : Object.values(glyphsData || {}))
                    ];

                    const found = allValues.find(item => item && (item.id === id || item.index === id));
                    if (found) return found;

                    return null;
                } catch (e) {
                    return null;
                }
            }

            let activeCount = 0;

            // Boucle séquentielle stricte de 1 à 256
            for (let id = 1; id <= 256; id++) {
                const card = document.createElement('div');
                const tile = getTileById(id);

                if (tile) {
                    activeCount++;
                    card.className = 'tile-card';
                    const name = tile.name || tile.label || `Tile_${id}`;
                    const visual = tile.svg || (tile.char ? `<span style="font-size:1.4rem; color:#fff;">${tile.char}</span>` : `<span style="color:#34d399">#${id}</span>`);
                    const desc = tile.description || tile.desc || 'Actif dans le moteur';

                    card.innerHTML = `
                        <div class="engine-view">${visual}</div>
                        <div class="tile-info">
                            <span style="background:#111827; padding:1px 4px; color:#9ca3af; width:fit-content;">ID: ${id}</span>
                            <strong style="color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${name}</strong>
                            <span style="color:var(--text-muted); font-size:0.65rem;">${desc}</span>
                        </div>
                    `;
                } else {
                    card.className = 'tile-card unimplemented';
                    card.innerHTML = `
                        <div class="engine-view"><span style="color:#6b7280; font-size:0.6rem;">N/A</span></div>
                        <div class="tile-info">
                            <span style="color:#6b7280;">ID: ${id}</span>
                            <span style="color:#6b7280; font-style:italic;">Non implémenté</span>
                        </div>
                    `;
                }
                grid.appendChild(card);
            }

            viewport.appendChild(grid);
        }

        renderRegistry();
    </script>
</body>
</html>
