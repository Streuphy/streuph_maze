<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Galerie Exhaustive par Scan d'IDs (1-256)</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --accent-color: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .glyph-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        /* Conteneur 1x1 Field aligné sur le rendu principal */
        .field-1x1 {
            width: 48px;
            height: 48px;
            background: #000;
            border: 2px solid #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }

        .glyph-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.8rem;
            overflow: hidden;
        }

        .glyph-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .glyph-name { font-weight: bold; color: #fff; font-size: 0.9rem; }
        .glyph-badge { background: #1e293b; color: #38bdf8; padding: 1px 5px; border-radius: 3px; font-size: 0.7rem; }
        .glyph-category { color: #a78bfa; font-size: 0.7rem; text-transform: uppercase; }

        .attributes-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 4px;
            padding: 5px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .attr-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.05); padding: 1px 0; }
        .attr-k { color: #94a3b8; }
        .attr-v { color: #f1f5f9; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h2>🧭 STREUPH MAZE — GALERIE PAR SCAN D'IDS (1 - 256)</h2>
            <p style="color: var(--text-muted); font-size: 0.8rem;">Balayage séquentiel et résolution directe via le scope global du moteur[span_0](start_span)[span_0](end_span)</p>
        </header>

        <div id="status" style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">Scan des IDs 1 à 256 en cours...</div>
        <main id="gallery-viewport" class="gallery-grid"></main>
    </div>

    <!-- Chargement des scripts globaux du moteur -->
    <script src="src/js/tiles.js"></script>
    <script src="src/js/sm-glyphs.js"></script>
    <script src="src/js/sm-entities.js"></script>
    <script src="src/js/sm-render.js"></script>
    <script src="src/js/sm-board.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const viewport = document.getElementById('gallery-viewport');
            const statusEl = document.getElementById('status');
            
            let renderedCount = 0;
            viewport.innerHTML = '';

            // Fonction de résolution robuste par ID (1 à 256)
            function resolveTileEntity(id) {
                const candidateNamespaces = [
                    window.Tiles, window.Glyphs, window.Entities, 
                    window.SM?.Tiles, window.SM?.Glyphs, window.SM
                ];

                for (const ns of candidateNamespaces) {
                    if (!ns) continue;
                    if (ns[id]) return ns[id];
                    for (const val of Object.values(ns)) {
                        if (val && typeof val === 'object' && (val.id === id || val.index === id)) {
                            return val;
                        }
                    }
                }

                if (typeof window.getTile === 'function') {
                    try { const res = window.getTile(id); if (res) return res; } catch(e){}
                }

                return null;
            }

            // Balayage séquentiel de 1 à 256 par scan d'ID
            for (let id = 1; id <= 256; id++) {
                const entity = resolveTileEntity(id);
                if (!entity) continue; // Ignore les IDs non implémentés

                renderedCount++;
                const card = document.createElement('div');
                card.className = 'glyph-card';

                const fieldBox = document.createElement('div');
                fieldBox.className = 'field-1x1';

                if (entity.svg && typeof entity.svg === 'string') {
                    fieldBox.innerHTML = entity.svg;
                } else if (entity.char || entity.symbol) {
                    fieldBox.innerHTML = `<span style="font-size:1.6rem; color:#fff;">${entity.char || entity.symbol}</span>`;
                } else {
                    fieldBox.innerHTML = `<span style="font-size:0.75rem; color:#38bdf8;">#${id}</span>`;
                }

                const name = entity.name || entity.label || `Glyph_${id}`;
                const category = entity.category || entity.type || 'Moteur';

                const skipKeys = ['svg', 'render', 'draw', 'callback', 'handler'];
                const attrHtml = Object.entries(entity)
                    .filter(([k, v]) => !skipKeys.includes(k) && v !== null && typeof v !== 'function')
                    .map(([k, v]) => `
                        <div class="attr-row">
                            <span class="attr-k">${k}:</span>
                            <span class="attr-v">${typeof v === 'object' ? JSON.stringify(v) : v}</span>
                        </div>
                    `).join('');

                card.innerHTML = `
                    <div class="field-slot"></div>
                    <div class="glyph-info">
                        <div class="glyph-header-row">
                            <span class="glyph-name">${name}</span>
                            <span class="glyph-badge">ID: ${id}</span>
                        </div>
                        <div class="glyph-category">Catégorie : ${category}</div>
                        <div class="attributes-box">
                            ${attrHtml || '<div style="color:var(--text-muted); font-style:italic;">Aucun attribut additionnel</div>'}
                        </div>
                    </div>
                `;
                card.querySelector('.field-slot').replaceWith(fieldBox);
                viewport.appendChild(card);
            }

            statusEl.textContent = `Scan terminé : ${renderedCount} glyphe(s) actif(s) affiché(s) sur les IDs 1-256.`;

            if (renderedCount === 0) {
                viewport.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444;">Aucun glyphe trouvé par scan direct. Le moteur utilise une structure globale indexée spécifique.</div>`;
            }
        });
    </script>
</body>
</html>
