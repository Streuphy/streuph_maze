<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Debug Verbose Default Export</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; }
        .console-box { background: #020617; border: 1px solid #3b82f6; border-radius: 6px; padding: 15px; font-size: 0.75rem; color: #93c5fd; max-height: 350px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 20px; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .test-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; gap: 12px; align-items: center; }
        .field-1x1 { width: 48px; height: 48px; background: #000; border: 2px solid #334155; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="app">
        <h2>🔍 VERBOSE MODULE INSPECTOR (.default analysis)</h2>
        <div id="console" class="console-box">[INIT] Analyse détaillée des structures d'export...</div>
        <div class="test-grid" id="test-viewport"></div>
    </div>

    <script type="module">
        const consoleBox = document.getElementById('console');
        const viewport = document.getElementById('test-viewport');

        function log(msg) {
            consoleBox.textContent += '\n' + msg;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        async function inspectModules() {
            const paths = ['./src/js/tiles.js', './src/js/sm-glyphs.js', './src/js/sm-render.js'];
            
            for (const path of paths) {
                try {
                    log(`\n--- Chargement de ${path} ---`);
                    const mod = await import(path);
                    log(`  Object.keys(mod): ${JSON.stringify(Object.keys(mod))}`);
                    log(`  Has .default? ${mod.default !== undefined} (type: ${typeof mod.default})`);
                    
                    if (mod.default && typeof mod.default === 'object') {
                        log(`  Object.keys(mod.default): ${JSON.stringify(Object.keys(mod.default).slice(0, 10))}`);
                    }
                } catch (e) {
                    log(`  ERREUR import ${path}: ${e.message}`);
                }
            }
        }

        inspectModules();
    </script>
</body>
</html>
