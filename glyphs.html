<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Galerie des Glyphs (ID 1-256)</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --accent-color: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }

        .glyph-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        /* Conteneur 1x1 Field aligné sur le moteur */
        .field-1x1 {
            width: 48px;
            height: 48px;
            background: #000;
            border: 2px solid #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            position: relative;
        }

        .glyph-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.8rem;
            overflow: hidden;
        }

        .glyph-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .glyph-name { font-weight: bold; color: #fff; font-size: 0.9rem; }
        .glyph-badge { background: #1e293b; color: #38bdf8; padding: 1px 5px; border-radius: 3px; font-size: 0.7rem; }
        .glyph-category { color: #a78bfa; font-size: 0.7rem; text-transform: uppercase; }

        .attributes-box {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 4px;
            padding: 5px;
            max-height: 80px;
            overflow-y: auto;
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .attr-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.05); padding: 1px 0; }
        .attr-k { color: #94a3b8; }
        .attr-v { color: #f1f5f9; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h2>🧭 STREUPH MAZE — GALERIE DES GLYPHS (ID 1 - 256)</h2>
            <p style="color: var(--text-muted); font-size: 0.8rem;">Affichage séquentiel par ID croissant avec gestion des exceptions (ES Modules)</p>
        </header>

        <div id="status" style="text-align: center; color: var(--text-muted); margin-bottom: 20px;">Chargement des modules ES...</div>
        <main id="gallery-viewport" class="gallery-grid"></main>
    </div>

    <script type="module">
        import * as TilesMod from './src/js/tiles.js';
        import * as GlyphsMod from './src/js/sm-glyphs.js';
        import * as RenderMod from './src/js/sm-render.js';

        const viewport = document.getElementById('gallery-viewport');
        const statusEl = document.getElementById('status');

        async function initGallery() {
            viewport.innerHTML = '';
            let registry = new Map();

            // Moissonneur universel pour extraire les entités des modules ES
            function harvest(mod) {
                if (!mod) return;
                const targets = [mod.Tiles, mod.Glyphs, mod.tiles, mod.glyphs, mod.default, mod];
                targets.forEach(t => {
                    if (!t) return;
                    if (Array.isArray(t)) {
                        t.forEach((item, idx) => {
                            if (item && typeof item === 'object') {
                                const id = item.id !== undefined ? item.id : idx;
                                registry.set(Number(id), item);
                            }
                        });
                    } else if (typeof t === 'object') {
                        Object.entries(t).forEach(([k, val], idx) => {
                            if (val && typeof val === 'object' && !Array.isArray(val)) {
                                const id = val.id !== undefined ? val.id : idx;
                                registry.set(Number(id), val);
                                registry.set(k, val);
                            }
                        });
                    }
                });
            }

            harvest(TilesMod);
            harvest(GlyphsMod);
            harvest(RenderMod);

            let displayedCount = 0;

            // Boucle séquentielle stricte de 1 à 256 par ordre croissant
            for (let id = 1; id <= 256; id++) {
                try {
                    let tile = registry.get(id);
                    if (!tile) {
                        for (const v of registry.values()) {
                            if (v && (v.id === id || v.index === id)) {
                                tile = v;
                                break;
                            }
                        }
                    }

                    if (!tile) continue; // Skip silencieux des IDs non implémentés

                    displayedCount++;
                    const card = document.createElement('div');
                    card.className = 'glyph-card';

                    const fieldBox = document.createElement('div');
                    fieldBox.className = 'field-1x1';

                    let rendered = false;
                    if (RenderMod && typeof RenderMod.renderTile === 'function') {
                        try {
                            const res = RenderMod.renderTile(id, tile);
                            if (res instanceof Element) {
                                fieldBox.appendChild(res);
                                rendered = true;
                            }
                        } catch (e) {}
                    }

                    if (!rendered) {
                        if (tile.svg && typeof tile.svg === 'string') {
                            fieldBox.innerHTML = tile.svg;
                        } else if (tile.char || tile.symbol) {
                            fieldBox.innerHTML = `<span style="font-size:1.6rem; color:#fff;">${tile.char || tile.symbol}</span>`;
                        } else {
                            fieldBox.innerHTML = `<span style="font-size:0.75rem; color:#38bdf8;">#${id}</span>`;
                        }
                    }

                    const name = tile.name || tile.label || `Glyph_${id}`;
                    const category = tile.category || tile.type || 'Standard';

                    const skipKeys = ['svg', 'render', 'draw', 'callback', 'handler'];
                    const attrHtml = Object.entries(tile)
                        .filter(([k, v]) => !skipKeys.includes(k) && v !== null && typeof v !== 'function')
                        .map(([k, v] ) => `
                            <div class="attr-row">
                                <span class="attr-k">${k}:</span>
                                <span class="attr-v">${typeof v === 'object' ? JSON.stringify(v) : v}</span>
                            </div>
                        `).join('');

                    card.innerHTML = `
                        <div class="field-slot"></div>
                        <div class="glyph-info">
                            <div class="glyph-header-row">
                                <span class="glyph-name">${name}</span>
                                <span class="glyph-badge">ID: ${id}</span>
                            </div>
                            <div class="glyph-category">Catégorie : ${category}</div>
                            <div class="attributes-box">
                                ${attrHtml || '<div style="color:var(--text-muted); font-style:italic;">Aucun attribut additionnel</div>'}
                            </div>
                        </div>
                    `;
                    card.querySelector('.field-slot').replaceWith(fieldBox);
                    viewport.appendChild(card);

                } catch (err) {
                    continue; // Skip par exception
                }
            }

            statusEl.textContent = `Galerie générée : ${displayedCount} glyphe(s) affiché(s) par ordre d'ID croissant (1-256)[span_1](start_span)[span_1](end_span).`;
            if (displayedCount === 0) {
                statusEl.textContent = "Aucun glyphe résolu. Vérifiez les structures exportées dans les modules source[span_2](start_span)[span_2](end_span).";
            }
        }

        initGallery();
    </script>
</body>
</html>
