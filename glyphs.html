<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streuph Maze - Super Verbose Global Scope & Crate Renderer</title>
    <link rel="stylesheet" href="src/css/sm.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        .console-box {
            background: #020617;
            border: 1px solid #3b82f6;
            border-radius: 6px;
            padding: 15px;
            font-size: 0.75rem;
            color: #93c5fd;
            max-height: 250px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            max-width: 420px;
        }
        .field-1x1 {
            width: 56px;
            height: 56px;
            background: #000;
            border: 2px solid #334155;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="app">
        <h2>📦 SUPER VERBOSE CRATE RENDERER (Global Scope Inspection)</h2>
        <div id="verbose-console" class="console-box">[INIT] Chargement des scripts du moteur via balises script classiques...</div>
        
        <div id="render-container" style="margin-top: 20px;">
            <h3>Rendu Cible (Crate / Boîte)</h3>
            <div id="crate-slot"></div>
        </div>
    </div>

    <!-- Chargement des scripts du moteur sous forme de scripts classiques pour peupler window -->
    <script src="src/js/tiles.js"></script>
    <script src="src/js/sm-glyphs.js"></script>
    <script src="src/js/sm-render.js"></script>

    <script>
        const consoleBox = document.getElementById('verbose-console');
        const crateSlot = document.getElementById('crate-slot');

        function logVerbose(msg) {
            consoleBox.textContent += '\n' + msg;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        window.addEventListener('DOMContentLoaded', () => {
            logVerbose("[DOM] DOM entièrement chargé.");
            logVerbose("[WINDOW] Inspection des propriétés globales ajoutées par les scripts du moteur :");

            // Liste de filtrage des propriétés natives de window
            const standardGlobals = [
                'window', 'self', 'document', 'location', 'customElements', 'history', 
                'navigation', 'top', 'parent', 'frames', 'closed', 'length', 'opener', 
                'navigator', 'origin', 'screen', 'innerWidth', 'innerHeight', 'scrollX', 
                'scrollY', 'screenX', 'screenY', 'outerWidth', 'outerHeight', 'devicePixelRatio', 
                'clientInformation', 'screenLeft', 'screenTop', 'styleMedia', 'onsearch', 
                'trustedTypes', 'performance', 'console', 'localStorage', 'sessionStorage', 
                'indexedDB', 'crypto', 'Event', 'CustomEvent', 'Image', 'Node', 'Element'
            ];
            
            const customGlobals = Object.keys(window).filter(key => !standardGlobals.includes(key));
            logVerbose(`[WINDOW] Objets globaux personnalisés détectés : ${JSON.stringify(customGlobals)}`);

            // Inspection approfondie de chaque objet global personnalisé
            customGlobals.forEach(globalName => {
                try {
                    const val = window[globalName];
                    logVerbose(`  - window.${globalName} (type: ${typeof val})`);
                    if (val && typeof val === 'object') {
                        logVerbose(`    Sous-clés : ${JSON.stringify(Object.keys(val).slice(0, 15))}`);
                    }
                } catch (e) {
                    logVerbose(`  - window.${globalName} : impossible d'inspecter (${e.message})`);
                }
            });

            logVerbose("[RENDER] Génération de la vue 1x1 field pour la Crate...");

            // Construction du conteneur 1x1 field pour la caisse (crate)
            const field1x1 = document.createElement('div');
            field1x1.className = 'field-1x1';
            field1x1.innerHTML = `<span style="color:#f59e0b; font-weight:bold; font-size:1.1rem;">📦</span>`;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div id="target-field"></div>
                <div style="font-size: 0.8rem; display: flex; flex-direction: column; gap: 4px;">
                    <div><strong style="color:#fff;">Crate / Boîte Poussable</strong></div>
                    <div style="color:var(--text-muted);">Attributs : ID Sokoban / Poussable</div>
                    <div style="color:#38bdf8; font-size:0.7rem;">Rendu 1x1 Field Validé</div>
                </div>
            `;
            card.querySelector('#target-field').replaceWith(field1x1);
            crateSlot.appendChild(card);

            logVerbose("[RENDER] Rendu de la caisse effectué avec succès.");
        });
    </script>
</body>
</html>
